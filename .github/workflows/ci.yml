name: Rust CI

on:
  push:
    branches: [ "main" ] # Or your default branch
  pull_request:
    branches: [ "main" ] # Or your default branch

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info # Enable logging for tests

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable # Or your preferred channel

      - name: Setup Rust Nightly (via Nix)
        run: nix develop --command echo "Rust Nightly environment activated"

      # It's often simpler to just use a Rust setup action for CI if Nix caching/environment isn't strictly needed for the build itself.
      # If the `nix develop` command above doesn't fully set up the environment for subsequent steps in a way GH Actions likes,
      # consider falling back to a standard Rust setup action for nightly.
      # Example alternative Rust setup (remove nix steps if using this):
      # - name: Install Rust Nightly
      #   uses: dtolnay/rust-toolchain@nightly
      #   with:
      #     components: rust-src # If needed by any tools

      - name: Build main proxy and backend
        run: |
          nix develop --command cargo build --verbose --workspace
          # If not using nix develop for the command context:
          # cargo build --verbose --workspace
        working-directory: ./ # Adjust if your workspace is structured differently

      - name: Run tests
        run: |
          nix develop --command cargo test --verbose --workspace
          # If not using nix develop for the command context:
          # cargo test --verbose --workspace
        working-directory: ./ # Adjust if your workspace is structured differently

      - name: Run Clippy (Linting)
        run: |
          nix develop --command cargo clippy -- -D warnings
          # If not using nix develop for the command context:
          # cargo clippy -- -D warnings
        working-directory: ./
```
